# SNY — mises à jour de fiches publiées : un événement judiciaire nouveau et étayé (analyse de la Maintenance, SANS changement de statut) →
# candidate générée avec la source nouvelle → aperçu déposé sur main → proposition « MISE À JOUR » envoyée sur Telegram. Aucune publication :
# le clic, la promotion et la vérification du site servi sont ceux de sny-clics / sny-telegram.
#
# Workflow SÉPARÉ de sny-clics : la génération appelle un modèle et dure plusieurs minutes ; dans le groupe de concurrence « sny-telegram »
# elle ferait attendre (ou perdre) les clics. Ici : son propre groupe, aucune lecture des clics, aucune projection.
# contents: write — uniquement docs/industrialisation/fiches-generees (aperçu de la candidate) ; jamais l'artefact public ni le build.
name: sny-maj-fiches

on:
  schedule:
    - cron: '47 6-18 * * *'
  workflow_dispatch:
    inputs:
      case:
        description: "Relancer UNE première fiche (ex. FR-2026-0144), sans le délai de retentative — facultatif"
        required: false
        type: string
      designee:
        description: "Avec « case » : l'éditeur DÉSIGNE cette affaire — hors périmètre du relais (ni événement récent, ni source de moins de 7 jours exigés) ; les autres garde-fous restent"
        required: false
        type: boolean
        default: false
      enrichir:
        description: "Avec « case » : applique la matière RÉDIGÉE de data/fiches-enrichissements/<case>.json à la fiche APPROUVÉE (étapes + bloc « Acteur de terrain »), sans modèle — une MISE À JOUR est proposée sur Telegram, jamais publiée"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sny-maj-fiches
  cancel-in-progress: false

jobs:
  maj:
    runs-on: ubuntu-latest
    timeout-minutes: 60   # 2 générations de 25 min au plus par passage (proposer-mises-a-jour-fiches : DELAI_GENERATION_MS)
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_ALLOWED_USER_ID: ${{ secrets.TELEGRAM_ALLOWED_USER_ID }}
      SNY_DIFFUSION_ACTIVE: ${{ vars.SNY_DIFFUSION_ACTIVE }}
      SNY_DIFFUSION_MODE: ${{ vars.SNY_DIFFUSION_MODE }}
      SNY_DIFFUSION_DEPUIS: ${{ vars.SNY_DIFFUSION_DEPUIS }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      # Le modèle n'est appelé que s'il y a une affaire retenue (sinon : une requête SQL). Les logs n'affichent jamais titres ni URL d'articles (dépôt public).
      # PREMIÈRE fiche des nouveautés que le relais social attend (événements ≥ T0 sans fiche approuvée, source < 7 jours) : sans elle le relais ne peut pas avancer.
      # Inerte si le relais n'est pas en mode REVIEW. Aucune publication : la proposition « APPROUVER LA FICHE » attend le clic de l'éditeur.
      - name: Proposer les premières fiches des nouveautés du relais (aucune publication)
        id: premieres
        if: ${{ inputs.enrichir != true }}
        env:
          CAS: ${{ inputs.case }}
          DESIGNEE: ${{ inputs.designee }}
        run: |
          if [ -n "$CAS" ]; then
            options=""
            if [ "$DESIGNEE" = "true" ]; then options="--designee"; fi
            case "$CAS" in FR-2026-[0-9][0-9][0-9][0-9]|POC-[0-9][0-9]) node scripts/proposer-premieres-fiches.mjs --ecrire --case "$CAS" --sans-delai $options ;; *) echo "identifiant refusé"; exit 2 ;; esac
          else
            node scripts/proposer-premieres-fiches.mjs --ecrire
          fi
      # ENRICHISSEMENT RÉDIGÉ d'une fiche approuvée (éditeur → « case » + « enrichir ») : la matière versionnée s'applique à UNE version approuvée précise (empreinte de base) ;
      # aucun modèle, aucune publication — la MISE À JOUR est proposée sur Telegram et attend le clic. Aperçu déposé sur main, comme les autres.
      - name: Enrichir une fiche approuvée avec une matière rédigée (mise à jour proposée, aucune publication)
        id: enrichir
        if: ${{ inputs.enrichir == true }}
        env:
          CAS: ${{ inputs.case }}
        run: |
          case "$CAS" in FR-2026-[0-9][0-9][0-9][0-9]|POC-[0-9][0-9]) ;; *) echo "identifiant refusé : « case » est exigé avec « enrichir »"; exit 2 ;; esac
          node scripts/enrichir-fiche.mjs "$CAS" --ecrire
          node scripts/proposer-fiche.mjs "$CAS" --generee --ecrire | tee "$RUNNER_TEMP/proposition.log"
          if grep -q "proposition créée" "$RUNNER_TEMP/proposition.log"; then echo "change=true" >> "$GITHUB_OUTPUT"; fi
      - name: Proposer les mises à jour de fiches (événement judiciaire nouveau, aucune publication)
        id: maj
        if: ${{ inputs.enrichir != true }}
        run: node scripts/proposer-mises-a-jour-fiches.mjs --ecrire
      - name: Déposer l'aperçu sur main (docs seulement ; AVANT l'envoi de la proposition)
        if: ${{ steps.maj.outputs.change == 'true' || steps.premieres.outputs.change == 'true' || steps.enrichir.outputs.change == 'true' }}
        run: |
          git config user.name "sny-bot"
          git config user.email "sny-bot@users.noreply.github.com"
          git add docs/industrialisation/fiches-generees
          if ! git diff --cached --quiet; then
            git commit -m "docs: aperçu de mise à jour de fiche (proposition Telegram), aucune publication"
            git push origin HEAD:main || (git pull --rebase origin main && git push origin HEAD:main)
          fi
      - name: Envoyer la proposition (une seule fois ; l'aperçu est sur main)
        if: ${{ steps.maj.outputs.change == 'true' || steps.premieres.outputs.change == 'true' || steps.enrichir.outputs.change == 'true' }}
        run: node scripts/telegram-v0.mjs notifier-nouvelles 3
