# SNY — cycle autonome : veille → maintenance → Telegram → clics → apply.
# Aucun poste n'est requis. Maintenance : une fois par jour (GitHub planifie « au mieux » : +5 à +15 min possibles).
# Note de sécurité : docs/industrialisation/AUTONOMOUS_LOOP_V1.md
name: sny-cycle

on:
  # Créneaux dans la journée : GitHub perd la grande majorité des déclenchements schedule de ce dépôt (mesuré), le garde-fou
  # (scripts/garde-quotidien.mjs) n'en laisse passer qu'un par jour.
  schedule:
    - cron: '23,53 6-17 * * *'
  # Relais : sny-clics reçoit ses déclenchements schedule (≈ toutes les 5 h). Chaque fin réussie d'un run planifié de sny-clics
  # est une occasion supplémentaire de faire le passage du jour — même garde-fou, même fenêtre horaire.
  workflow_run:
    workflows: [sny-clics]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

# Un seul job SNY à la fois : Telegram refuse deux getUpdates simultanés.
concurrency:
  group: sny-telegram
  cancel-in-progress: false

jobs:
  cycle:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'schedule') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_ALLOWED_USER_ID: ${{ secrets.TELEGRAM_ALLOWED_USER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # Le planificateur GitHub perd des déclenchements : plusieurs créneaux dans la journée, UN SEUL passage productif.
      # (workflow_dispatch n'est pas concerné.)
      - name: 0. garde-fou quotidien
        id: garde
        if: ${{ github.event_name != 'workflow_dispatch' }}
        run: node scripts/garde-quotidien.mjs verifier maintenance

      # Dépôt public => logs publics. La sortie de la veille (requêtes, titres, URL, erreur brute) va dans un
      # fichier du runner ; seuls deux compteurs et le code de sortie sont affichés.
      - name: A. veille (Google News → data/watch-report.json)
        if: ${{ steps.garde.outputs.skip != 'true' }}
        run: |
          set +e
          node scripts/watch-updates.mjs > "$RUNNER_TEMP/watch.log" 2>&1
          code=$?
          grep -E "affaire\(s\) à surveiller|affaire\(s\) avec nouveaux articles" "$RUNNER_TEMP/watch.log"
          echo "erreurs de recherche : $(grep -c 'Erreur recherche' "$RUNNER_TEMP/watch.log")"
          echo "watch-updates : code de sortie $code"
          exit $code
      - name: B. maintenance (preuve → compréhension → propositions)
        if: ${{ steps.garde.outputs.skip != 'true' }}
        run: node scripts/maintenance-cycle.mjs --moteur deepseek/deepseek-v4.1-flash --contrat v2

      # C-E tournent même si la veille ou la maintenance ont échoué : les clics en attente ne doivent pas attendre.
      - name: "C. notifier (Telegram : information sans bouton, décision avec boutons)"
        if: ${{ (!cancelled()) && steps.garde.outputs.skip != 'true' }}
        run: node scripts/telegram-v0.mjs notifier 10
      - name: D. recevoir les clics Telegram
        if: ${{ (!cancelled()) && steps.garde.outputs.skip != 'true' }}
        run: node scripts/telegram-v0.mjs recevoir
      - name: E. appliquer les ACCEPT simples (AUTO_APPLICABLE uniquement)
        if: ${{ (!cancelled()) && steps.garde.outputs.skip != 'true' }}
        run: node scripts/appliquer-decisions.mjs --generique
      - name: F. appliquer les décisions Discovery à Neon (jamais de publication)
        if: ${{ (!cancelled()) && steps.garde.outputs.skip != 'true' }}
        run: node scripts/appliquer-nouvelles-affaires.mjs --ecrire
      - name: Z. consigner le passage du jour
        if: ${{ github.event_name != 'workflow_dispatch' && steps.garde.outputs.skip != 'true' && success() }}
        run: node scripts/garde-quotidien.mjs marquer maintenance
