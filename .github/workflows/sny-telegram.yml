# SNY — clic Telegram reçu PAR WEBHOOK (Worker Cloudflare `sny-telegram`) : enregistrer, appliquer, projeter, vérifier, confirmer.
# Déclenché UNIQUEMENT par le Worker (authentifié par le secret du webhook Telegram). Réutilise les scripts existants.
# sny-clics reste en filet de sécurité (application des décisions déjà enregistrées) ; il ne lit plus getUpdates quand le webhook est actif.
name: sny-telegram

on:
  workflow_dispatch:
    inputs:
      update:
        description: "Mise à jour Telegram (JSON) émise par le Worker authentifié"
        required: true
        type: string

# contents: write — seulement pour la projection publique d'une affaire DÉJÀ publiée (étape finale, après QA).
permissions:
  contents: write

concurrency:
  group: sny-telegram
  cancel-in-progress: false

jobs:
  clic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_ALLOWED_USER_ID: ${{ secrets.TELEGRAM_ALLOWED_USER_ID }}
      SNY_WEBHOOK: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: 1. Enregistrer le clic (idempotent)
        id: enregistrer
        env:
          UPDATE_JSON: ${{ inputs.update }}
        run: node scripts/telegram-v0.mjs traiter
      - name: 2. Appliquer les ACCEPT simples (AUTO_APPLICABLE uniquement)
        id: simples
        run: node scripts/appliquer-decisions.mjs --generique
      - name: 3. Appliquer les décisions Discovery à Neon (jamais de publication)
        id: discovery
        run: node scripts/appliquer-nouvelles-affaires.mjs --ecrire
      - name: 4. Projeter les évolutions validées d'affaires DÉJÀ publiques
        id: projection
        run: node scripts/publier-evolutions.mjs
      # Chaque projection repart de l'artefact COMMITÉ (HEAD) : valider l'étape précédente en local (sans pousser) évite qu'elle soit écrasée.
      - name: 4b. Valider localement les évolutions (commit local, rien n'est poussé)
        if: ${{ steps.projection.outputs.change == 'true' }}
        run: |
          git config user.name "sny-bot"
          git config user.email "sny-bot@users.noreply.github.com"
          git add data/cases.json
          git commit -m "publication: évolution validée par l'éditeur ($PROJ_IDS)"
        env:
          PROJ_IDS: ${{ steps.projection.outputs.ids }}
      # GO PUBLICATION explicite (publier-affaire --go, déjà consigné dans Neon) → garde-fous (HOLD, retrait, fiabilité, GO postérieur à l'activation) →
      # project-public --ajouter (lot). Jamais de publication d'une candidate ici. Une affaire bloquée n'empêche jamais les autres ; rejouable.
      - name: 5. Exécuter la suite d'une publication autorisée (projection ciblée)
        id: reconcile
        env:
          SNY_PUBLICATION_DEPUIS: '2026-10-11T14:19:00Z'
        run: node scripts/reconcilier-publication.mjs --ecrire
      - name: 6. QA avant toute publication
        id: qa
        if: ${{ steps.projection.outputs.change == 'true' || steps.reconcile.outputs.change == 'true' }}
        run: node scripts/qa/run-all.mjs
      - name: 7. Publier la projection (commit sur main → build Cloudflare existant)
        id: publier
        if: ${{ steps.projection.outputs.change == 'true' || steps.reconcile.outputs.change == 'true' }}
        run: |
          git config user.name "sny-bot"
          git config user.email "sny-bot@users.noreply.github.com"
          if [ "$RECON_CHANGE" = "true" ]; then
            git add data/cases.json
            git commit -m "publication: affaire(s) validée(s) par l'éditeur ($RECON_IDS)"
          fi
          git push origin HEAD:main || (git pull --rebase origin main && git push origin HEAD:main)
        env:
          RECON_CHANGE: ${{ steps.reconcile.outputs.change }}
          RECON_IDS: ${{ steps.reconcile.outputs.ids }}
      - name: 8. Vérifier le site public et confirmer sur Telegram
        id: verifier
        if: ${{ steps.projection.outputs.change == 'true' || steps.reconcile.outputs.change == 'true' }}
        run: node scripts/verifier-site.mjs $(echo "$PROJ_IDS,$RECON_IDS" | tr ',' ' ')
        env:
          PROJ_IDS: ${{ steps.projection.outputs.ids }}
          RECON_IDS: ${{ steps.reconcile.outputs.ids }}
      # Le site SERVI est la preuve : tout ce que l'artefact annonce doit y être. Sinon le job est rouge et le passage suivant réessaie.
      - name: 9. Contrôler le site réellement servi
        id: controle
        if: ${{ !cancelled() }}
        run: node scripts/reconcilier-publication.mjs --site
      # Jamais de perte silencieuse : le webhook a déjà répondu 200 à Telegram, qui ne rejouera pas ce clic.
      - name: Alerter si le traitement a échoué
        if: ${{ failure() }}
        env:
          OUTCOME_enregistrer: ${{ steps.enregistrer.outcome }}
          OUTCOME_simples: ${{ steps.simples.outcome }}
          OUTCOME_discovery: ${{ steps.discovery.outcome }}
          OUTCOME_projection: ${{ steps.projection.outcome }}
          OUTCOME_qa: ${{ steps.qa.outcome }}
          OUTCOME_publier: ${{ steps.publier.outcome }}
          OUTCOME_verifier: ${{ steps.verifier.outcome }}
          OUTCOME_reconcile: ${{ steps.reconcile.outcome }}
          OUTCOME_controle: ${{ steps.controle.outcome }}
        run: node scripts/alerte-clic.mjs
