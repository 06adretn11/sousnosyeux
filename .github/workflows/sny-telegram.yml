# SNY — clic Telegram reçu PAR WEBHOOK (Worker Cloudflare `sny-telegram`) : enregistrer, appliquer, projeter, vérifier, confirmer.
# Déclenché UNIQUEMENT par le Worker (authentifié par le secret du webhook Telegram). Réutilise les scripts existants.
# sny-clics reste en filet de sécurité (application des décisions déjà enregistrées) ; il ne lit plus getUpdates quand le webhook est actif.
name: sny-telegram

on:
  workflow_dispatch:
    inputs:
      update:
        description: "Mise à jour Telegram (JSON) émise par le Worker authentifié"
        required: true
        type: string

# contents: write — seulement pour la projection publique d'une affaire DÉJÀ publiée (étape finale, après QA).
permissions:
  contents: write

concurrency:
  group: sny-telegram
  cancel-in-progress: false

jobs:
  clic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_ALLOWED_USER_ID: ${{ secrets.TELEGRAM_ALLOWED_USER_ID }}
      SNY_WEBHOOK: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: 1. Enregistrer le clic (idempotent)
        env:
          UPDATE_JSON: ${{ inputs.update }}
        run: node scripts/telegram-v0.mjs traiter
      - name: 2. Appliquer les ACCEPT simples (AUTO_APPLICABLE uniquement)
        run: node scripts/appliquer-decisions.mjs --generique
      - name: 3. Appliquer les décisions Discovery à Neon (jamais de publication)
        run: node scripts/appliquer-nouvelles-affaires.mjs --ecrire
      - name: 4. Projeter les évolutions validées d'affaires DÉJÀ publiques
        id: projection
        run: node scripts/publier-evolutions.mjs
      - name: 5. QA avant toute publication
        if: ${{ steps.projection.outputs.change == 'true' }}
        run: node scripts/qa/run-all.mjs
      - name: 6. Publier la projection (commit sur main → build Cloudflare existant)
        if: ${{ steps.projection.outputs.change == 'true' }}
        run: |
          git config user.name "sny-bot"
          git config user.email "sny-bot@users.noreply.github.com"
          git add data/cases.json
          git commit -m "publication: évolution validée par l'éditeur (${{ steps.projection.outputs.ids }})"
          git push origin HEAD:main || (git pull --rebase origin main && git push origin HEAD:main)
      - name: 7. Vérifier le site public et confirmer sur Telegram
        if: ${{ steps.projection.outputs.change == 'true' }}
        run: node scripts/verifier-site.mjs ${{ steps.projection.outputs.ids }}
      # Jamais de perte silencieuse : le webhook a déjà répondu 200 à Telegram, qui ne rejouera pas ce clic.
      - name: Alerter si le traitement a échoué
        if: ${{ failure() }}
        run: node -e "import('./scripts/lib/prevenir.mjs').then((m) => m.prevenir('⚠️ Un clic a été reçu mais le traitement a ÉCHOUÉ (run GitHub sny-telegram en erreur). Rien n’a été perdu côté Telegram : le callback complet est dans l’entrée du run. Dis-le-moi, ou re-clique.'))"
