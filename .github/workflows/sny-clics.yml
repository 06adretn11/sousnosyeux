# SNY — récupération des clics Telegram + apply, toutes les 30 min (sans veille ni modèle ni coût : quelques secondes).
# Ce n'est PAS un run Discovery/Maintenance : il ne fait que traiter une décision déjà prise par Adrien.
name: sny-clics

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sny-telegram
  cancel-in-progress: false

jobs:
  clics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_ALLOWED_USER_ID: ${{ secrets.TELEGRAM_ALLOWED_USER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Recevoir les clics Telegram
        run: node scripts/telegram-v0.mjs recevoir
      - name: Appliquer les ACCEPT simples (AUTO_APPLICABLE uniquement)
        run: node scripts/appliquer-decisions.mjs --generique
      - name: Appliquer les décisions Discovery à Neon (jamais de publication)
        run: node scripts/appliquer-nouvelles-affaires.mjs --ecrire
