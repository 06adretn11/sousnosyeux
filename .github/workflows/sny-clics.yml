# SNY — récupération des clics Telegram + apply, toutes les 30 min (sans veille ni modèle ni coût : quelques secondes).
# Ce n'est PAS un run Discovery/Maintenance : il ne fait que traiter une décision déjà prise par Adrien.
# Avec le webhook actif (Worker `sny-telegram`), les clics arrivent par sny-telegram.yml : ce passage ne lit plus getUpdates
# (`recevoir` le détecte) et sert de FILET DE SÉCURITÉ — il applique et projette toute décision déjà enregistrée.
name: sny-clics

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

# contents: write — seulement pour la projection publique d'une affaire DÉJÀ publiée, après QA (étapes finales ; sans effet si rien à projeter).
permissions:
  contents: write

concurrency:
  group: sny-telegram
  cancel-in-progress: false

jobs:
  clics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_ALLOWED_USER_ID: ${{ secrets.TELEGRAM_ALLOWED_USER_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Recevoir les clics Telegram
        run: node scripts/telegram-v0.mjs recevoir
      - name: Appliquer les ACCEPT simples (AUTO_APPLICABLE uniquement)
        run: node scripts/appliquer-decisions.mjs --generique
      - name: Appliquer les décisions Discovery à Neon (jamais de publication)
        run: node scripts/appliquer-nouvelles-affaires.mjs --ecrire
      - name: Projeter les évolutions validées d'affaires DÉJÀ publiques
        id: projection
        run: node scripts/publier-evolutions.mjs
      # Chaque projection repart de l'artefact COMMITÉ (HEAD) : valider l'étape précédente en local (sans pousser) évite qu'elle soit écrasée.
      - name: Valider localement les évolutions (commit local, rien n'est poussé)
        if: ${{ steps.projection.outputs.change == 'true' }}
        run: |
          git config user.name "sny-bot"
          git config user.email "sny-bot@users.noreply.github.com"
          git add data/cases.json
          git commit -m "publication: évolution validée par l'éditeur ($PROJ_IDS)"
        env:
          PROJ_IDS: ${{ steps.projection.outputs.ids }}
      # PROPOSITION de publication (jamais une publication) : seules les NOUVELLES candidates examinées (validées après l'activation),
      # plafond 3 par passage, une proposition par candidate ; l'arriéré n'est jamais proposé sans demande explicite (--ids).
      - name: Proposer la publication des nouvelles candidates examinées (aucune publication)
        env:
          SNY_PUBLICATION_DEPUIS: '2026-10-11T14:19:00Z'
        run: node scripts/proposer-publication.mjs --ecrire
      - name: Envoyer les propositions non encore envoyées (une seule fois chacune)
        run: node scripts/telegram-v0.mjs notifier-nouvelles 3
      # Même réconciliation que sny-telegram (filet de sécurité : rattrape ce qu'un passage interrompu aurait laissé en route).
      - name: Exécuter la suite d'une publication autorisée (projection ciblée)
        id: reconcile
        env:
          SNY_PUBLICATION_DEPUIS: '2026-10-11T14:19:00Z'
        run: node scripts/reconcilier-publication.mjs --ecrire
      # Mémoire → surfaces : événements validés (fiches + Hubs) et fiches APPROUVÉES (revue Telegram « [Fiche approuvée] », empreinte du dossier à jour).
      # Même chaîne que la suite : QA → commit → push → build Cloudflare → vérification du site servi. Rejouable : lit Neon, réécrit seulement ce qui change.
      - name: Projeter événements validés et fiches approuvées
        id: evenements
        run: node scripts/project-evenements.mjs
      - name: QA avant toute publication
        if: ${{ steps.projection.outputs.change == 'true' || steps.reconcile.outputs.change == 'true' || steps.evenements.outputs.change == 'true' }}
        run: node scripts/qa/run-all.mjs
      - name: Publier la projection (commit sur main → build Cloudflare existant)
        if: ${{ steps.projection.outputs.change == 'true' || steps.reconcile.outputs.change == 'true' || steps.evenements.outputs.change == 'true' }}
        run: |
          git config user.name "sny-bot"
          git config user.email "sny-bot@users.noreply.github.com"
          git add data/cases.json data/evenements.json
          if ! git diff --cached --quiet; then
            git commit -m "publication: mise à jour validée par l'éditeur ($RECON_IDS $FICHES)"
          fi
          git push origin HEAD:main || (git pull --rebase origin main && git push origin HEAD:main)
        env:
          RECON_CHANGE: ${{ steps.reconcile.outputs.change }}
          RECON_IDS: ${{ steps.reconcile.outputs.ids }}
          FICHES: ${{ steps.evenements.outputs.fiches }}
      - name: Vérifier le site public et confirmer sur Telegram
        if: ${{ steps.projection.outputs.change == 'true' || steps.reconcile.outputs.change == 'true' || steps.evenements.outputs.change == 'true' }}
        run: |
          ARGS="$(echo "$PROJ_IDS,$RECON_IDS" | tr ',' ' ')"
          if [ -n "$FICHES" ]; then ARGS="$ARGS --fiches $FICHES"; fi
          if [ -n "$HUBS" ]; then ARGS="$ARGS --hubs $HUBS"; fi
          if [ -n "$(echo $ARGS)" ]; then node scripts/verifier-site.mjs $ARGS; else echo "aucune page à vérifier"; fi
        env:
          PROJ_IDS: ${{ steps.projection.outputs.ids }}
          RECON_IDS: ${{ steps.reconcile.outputs.ids }}
          FICHES: ${{ steps.evenements.outputs.fiches }}
          HUBS: ${{ steps.evenements.outputs.hubs }}
      - name: Contrôler le site réellement servi
        if: ${{ !cancelled() }}
        run: node scripts/reconcilier-publication.mjs --site
      # Hub : le clic « PRÉPARER LE HUB » produit un DOSSIER DE REVUE (docs/industrialisation/hub-drafts), jamais une page du site. Écrit → déposé sur main →
      # annoncé avec le lien, une seule fois, seulement après lecture du dossier sur main. Une erreur est dite sur Telegram ; elle ne bloque rien.
      # (Après la publication des pages : ce dépôt ne touche que docs/, jamais l'artefact public ni le build.)
      - name: Préparer les Hubs acceptés (dossier de revue, aucune publication)
        id: hubs
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: node scripts/preparer-hub.mjs --ecrire
      - name: Déposer l'aperçu de Hub sur main (dossier de revue + matière composée ; aucune page tant que PUBLIER LE HUB n'a pas son GO)
        if: ${{ !cancelled() && steps.hubs.outputs.change == 'true' }}
        continue-on-error: true
        run: |
          git config user.name "sny-bot"
          git config user.email "sny-bot@users.noreply.github.com"
          git add docs/industrialisation/hub-drafts data/hub-matiere
          if ! git diff --cached --quiet; then
            git commit -m "docs: aperçu de Hub préparé sur clic Telegram ($HUB_SLUGS), aucune publication"
            git push origin HEAD:main || (git pull --rebase origin main && git push origin HEAD:main)
          fi
        env:
          HUB_SLUGS: ${{ steps.hubs.outputs.slugs }}
      - name: Annoncer les brouillons de Hub prêts (lien vérifié sur main)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: node scripts/preparer-hub.mjs --annoncer
      # Diagnostic territorial : la mémoire a changé → un Hub est-il à intégrer, enrichir ou proposer ? Notifie SEULEMENT si les compteurs ont bougé ;
      # ne publie jamais rien ; une panne du diagnostic ne bloque jamais la publication.
      - name: Diagnostic territorial (réévaluation des Hubs)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: node scripts/diagnostic-territoire.mjs --ecrire
