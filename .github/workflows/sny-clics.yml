# SNY — récupération des clics Telegram + apply, toutes les 30 min (sans veille ni modèle ni coût : quelques secondes).
# Ce n'est PAS un run Discovery/Maintenance : il ne fait que traiter une décision déjà prise par Adrien.
# Avec le webhook actif (Worker `sny-telegram`), les clics arrivent par sny-telegram.yml : ce passage ne lit plus getUpdates
# (`recevoir` le détecte) et sert de FILET DE SÉCURITÉ — il applique et projette toute décision déjà enregistrée.
name: sny-clics

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

# contents: write — seulement pour la projection publique d'une affaire DÉJÀ publiée, après QA (étapes finales ; sans effet si rien à projeter).
permissions:
  contents: write

concurrency:
  group: sny-telegram
  cancel-in-progress: false

jobs:
  clics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_ALLOWED_USER_ID: ${{ secrets.TELEGRAM_ALLOWED_USER_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Recevoir les clics Telegram
        run: node scripts/telegram-v0.mjs recevoir
      - name: Appliquer les ACCEPT simples (AUTO_APPLICABLE uniquement)
        run: node scripts/appliquer-decisions.mjs --generique
      - name: Appliquer les décisions Discovery à Neon (jamais de publication)
        run: node scripts/appliquer-nouvelles-affaires.mjs --ecrire
      - name: Projeter les évolutions validées d'affaires DÉJÀ publiques
        id: projection
        run: node scripts/publier-evolutions.mjs
      # Chaque projection repart de l'artefact COMMITÉ (HEAD) : valider l'étape précédente en local (sans pousser) évite qu'elle soit écrasée.
      - name: Valider localement les évolutions (commit local, rien n'est poussé)
        if: ${{ steps.projection.outputs.change == 'true' }}
        run: |
          git config user.name "sny-bot"
          git config user.email "sny-bot@users.noreply.github.com"
          git add data/cases.json
          git commit -m "publication: évolution validée par l'éditeur ($PROJ_IDS)"
        env:
          PROJ_IDS: ${{ steps.projection.outputs.ids }}
      # PROPOSITION de publication (jamais une publication) : seules les NOUVELLES candidates examinées (validées après l'activation),
      # plafond 3 par passage, une proposition par candidate ; l'arriéré n'est jamais proposé sans demande explicite (--ids).
      - name: Proposer la publication des nouvelles candidates examinées (aucune publication)
        env:
          SNY_PUBLICATION_DEPUIS: '2026-10-11T14:19:00Z'
        run: node scripts/proposer-publication.mjs --ecrire
      - name: Envoyer les propositions non encore envoyées (une seule fois chacune)
        run: node scripts/telegram-v0.mjs notifier-nouvelles 3
      # Même réconciliation que sny-telegram (filet de sécurité : rattrape ce qu'un passage interrompu aurait laissé en route).
      - name: Exécuter la suite d'une publication autorisée (projection ciblée)
        id: reconcile
        env:
          SNY_PUBLICATION_DEPUIS: '2026-10-11T14:19:00Z'
        run: node scripts/reconcilier-publication.mjs --ecrire
      - name: QA avant toute publication
        if: ${{ steps.projection.outputs.change == 'true' || steps.reconcile.outputs.change == 'true' }}
        run: node scripts/qa/run-all.mjs
      - name: Publier la projection (commit sur main → build Cloudflare existant)
        if: ${{ steps.projection.outputs.change == 'true' || steps.reconcile.outputs.change == 'true' }}
        run: |
          git config user.name "sny-bot"
          git config user.email "sny-bot@users.noreply.github.com"
          if [ "$RECON_CHANGE" = "true" ]; then
            git add data/cases.json
            git commit -m "publication: affaire(s) validée(s) par l'éditeur ($RECON_IDS)"
          fi
          git push origin HEAD:main || (git pull --rebase origin main && git push origin HEAD:main)
        env:
          RECON_CHANGE: ${{ steps.reconcile.outputs.change }}
          RECON_IDS: ${{ steps.reconcile.outputs.ids }}
      - name: Vérifier le site public et confirmer sur Telegram
        if: ${{ steps.projection.outputs.change == 'true' || steps.reconcile.outputs.change == 'true' }}
        run: node scripts/verifier-site.mjs $(echo "$PROJ_IDS,$RECON_IDS" | tr ',' ' ')
        env:
          PROJ_IDS: ${{ steps.projection.outputs.ids }}
          RECON_IDS: ${{ steps.reconcile.outputs.ids }}
      - name: Contrôler le site réellement servi
        if: ${{ !cancelled() }}
        run: node scripts/reconcilier-publication.mjs --site
